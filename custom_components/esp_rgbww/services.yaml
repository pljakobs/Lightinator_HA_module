fade_sequence:
  name: Fade Sequence
  description: >
    Queue a multi-step colour sequence on a Lightinator device. Each step fades
    or jumps to a colour over the specified duration. Steps are processed in order
    using the device's animation queue.
  target:
    device:
      integration: esp_rgbww
  fields:
    steps:
      name: Steps
      description: >
        List of colour steps. Each step is an object with at minimum one colour
        key and a duration. Supported keys per step:
          hsv   – HSV colour object with optional h (0-360), s (0-100), v (0-100), ct (Kelvin).
          raw   – Raw PWM values object with optional r, g, b, ww, cw (0-1023).
          t     – Duration in milliseconds (integer). Omit for an instant jump.
          cmd   – "fade" (default) or "solid" (instant set).
          name  – Optional label for the step (string).
        The integration automatically sets queue policy: first step clears the
        animation queue (front_reset), subsequent steps are appended (back).
      required: true
      example:
        - hsv:
            h: 0
            s: 100
            v: 100
          t: 2000
          cmd: fade
        - hsv:
            h: 120
            s: 100
            v: 100
          t: 2000
          cmd: fade
        - hsv:
            h: 240
            s: 100
            v: 100
          t: 2000
          cmd: fade
      selector:
        object:
    loop:
      name: Loop last step
      description: >
        When enabled, the last step in the sequence will repeat continuously
        (requeue itself) until the animation is stopped.
      default: false
      selector:
        boolean:

blink:
  name: Blink
  description: >
    Trigger a blink (on/off) animation on a Lightinator device. The device
    alternates between its current colour and off at the specified speed.
  target:
    device:
      integration: esp_rgbww
  fields:
    speed_ms:
      name: Speed
      description: Half-period of each blink cycle in milliseconds (time on or off).
      default: 500
      selector:
        number:
          min: 50
          max: 10000
          step: 50
          unit_of_measurement: ms
          mode: box
    loop:
      name: Loop
      description: Keep blinking until the animation is explicitly stopped.
      default: false
      selector:
        boolean:

discover_cluster:
  name: Discover Cluster Controllers
  description: >
    Query the selected Lightinator device's /hosts endpoint and automatically
    attempt to add all discovered peer controllers to Home Assistant.
  target:
    device:
      integration: esp_rgbww

save_preset:
  name: Save current color as preset
  description: Save or update a controller-local preset from its current color.
  target:
    device:
      integration: esp_rgbww
  fields:
    name:
      name: Preset name
      description: An existing preset with this name will be updated.
      required: true
      selector:
        text:
    color_mode:
      name: Color representation
      description: Save the current HSV or raw-channel color representation.
      default: hsv
      selector:
        select:
          options:
            - hsv
            - raw
    favorite:
      name: Favorite
      description: Mark the preset as a favorite (leave empty to preserve its current value).
      selector:
        boolean:

scan_wifi:
  name: Scan Wi-Fi networks
  description: Start a Wi-Fi scan on the selected controller.
  target:
    device:
      integration: esp_rgbww

connect_wifi:
  name: Connect to Wi-Fi
  description: Connect the selected controller to a Wi-Fi network.
  target:
    device:
      integration: esp_rgbww
  fields:
    ssid:
      name: SSID
      required: true
      selector:
        text:
    password:
      name: Wi-Fi password
      selector:
        text:
          type: password
